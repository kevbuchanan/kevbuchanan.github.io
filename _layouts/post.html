---
layout: default
---

<article>
  <header class="entry-header">
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
  </header>

  <div class="entry-content">
    {{ content }}
  </div>

  <footer class="entry-footer">
    <a href="{{ '/' | relative_url }}">&larr; All posts</a>
  </footer>
</article>
