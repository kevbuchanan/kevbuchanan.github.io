# Site
title:              "Kevin Buchanan"
description:        "Kevin Buchanan writes about software design, functional programming, and cities."
tagline:            "Notes on software and cities"
url:                "https://kevbuchanan.github.io"
baseurl:            "" # must end WITHOUT a slash
lang:               en

author:
  name:             "Kevin Buchanan"
  email:            kevaustinbuch@gmail.com
  twitter:          kevinbuch_

twitter:
  username:         kevinbuch_
  card:             summary

social:
  name:             "Kevin Buchanan"
  links:
    - https://github.com/kevbuchanan
    - https://www.linkedin.com/in/buchanankevin
    - https://twitter.com/kevinbuch_

# Build
permalink:          /posts/:title
timezone:           America/Chicago
markdown:           kramdown
kramdown:
  input:            GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false
sass:
  style:            compressed
  sourcemap:        never

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path:             feed.xml

include:            [ "robots.txt" ]
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  # OmniGraffle sources for the post diagrams; the exported images ship instead.
  - "assets/**/*.graffle"

defaults:
  - scope:
      path:         ""
    values:
      layout:       "null"
  - scope:
      type:         "pages"
    values:
      layout:       "page"
  - scope:
      type:         "posts"
    values:
      layout:       "post"
