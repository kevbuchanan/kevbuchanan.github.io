<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}

<link rel="stylesheet" href="{{ '/assets/core.css' | relative_url }}">

<!-- The roman latin subset covers every page, so fetch it alongside the CSS
     rather than waiting for the stylesheet to request it. -->
<link rel="preload" href="{{ '/assets/fonts/public-sans-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

<link rel="icon" href="{{ '/assets/touch-icon.png' | relative_url }}" sizes="any">
<link rel="apple-touch-icon" href="{{ '/assets/touch-icon.png' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
